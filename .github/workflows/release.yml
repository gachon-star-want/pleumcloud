name: Release

# Tag v* → one GitHub Release carrying everything:
#   - CLI binaries via goreleaser (this job also creates the release)
#   - macOS dmg + Windows NSIS installer via wails (uploaded after)
# Desktop version sources: wails.json productVersion (bundle/NSIS) and the
# -X main.version ldflag (API/banner). Both must equal the tag — the guard
# below fails the release early if they drift.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Version guard (tag vs wails.json)
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CFG="$(jq -r .info.productVersion desktop/wails.json)"
          if [ "$TAG" != "$CFG" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match desktop/wails.json productVersion $CFG"
            exit 1
          fi

      - name: Build frontend (tests compile the embed)
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Go tests
        run: go test ./...

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  desktop-macos:
    runs-on: macos-latest # arm64 runner; universal app via lipo
    needs: cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend (embedded by the core)
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Install wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build desktop app (universal)
        working-directory: desktop
        env:
          VERSION: ${{ github.ref_name }}
        run: wails build -platform darwin/universal -ldflags "-X main.version=${VERSION#v}"

      - name: Package dmg
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          lipo -info desktop/build/bin/PleumCloud.app/Contents/MacOS/PleumCloud
          hdiutil create -volname PleumCloud -srcfolder desktop/build/bin/PleumCloud.app \
            -ov -format UDZO "PleumCloud-${VERSION}-macOS-universal.dmg"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: gh release upload "$VERSION" "PleumCloud-${VERSION}-macOS-universal.dmg" --clobber

  desktop-windows:
    runs-on: windows-latest # makensis is preinstalled
    needs: cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend (embedded by the core)
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Install wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build desktop app + NSIS installer
        working-directory: desktop
        env:
          VERSION: ${{ github.ref_name }}
        run: wails build -platform windows/amd64 -ldflags "-X main.version=$($env:VERSION -replace '^v','')"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          mv desktop/build/bin/PleumCloud-amd64-installer.exe "PleumCloud-${env:VERSION}-windows-amd64-installer.exe"
          gh release upload "$env:VERSION" "PleumCloud-${env:VERSION}-windows-amd64-installer.exe" --clobber
