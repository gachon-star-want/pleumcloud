name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Vet
        if: matrix.os == 'ubuntu-latest'
        run: go vet ./...

      - name: Test
        if: matrix.os == 'ubuntu-latest'
        run: go test ./...

      - name: Build binary
        run: go build -o pleumcloud${{ matrix.os == 'windows-latest' && '.exe' || '' }} ./cmd/web

      - uses: actions/upload-artifact@v4
        with:
          name: pleumcloud-${{ matrix.os }}
          path: pleumcloud*
