version: 2

project_name: pleumcloud

before:
  hooks:
    - go mod tidy
    # The embedded SPA must be built once before the Go binary embeds it.
    # Runs here, not as a per-build pre hook: goreleaser builds targets in
    # parallel and concurrent `npm ci` in the same dir races on rmdir.
    - bash -c "cd web && npm ci && npm run build"

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"

